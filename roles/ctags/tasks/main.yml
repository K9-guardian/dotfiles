- name: Get latest ctags information
  include_tasks: "../../dotfiles-core/tasks/github_release_asset.yml"
  vars:
    github_repo: "universal-ctags/ctags-nightly-build"

- name: Install ctags from archive
  include_tasks: "../../dotfiles-core/tasks/install_archive.yml"
  vars:
    archive_app_name: ctags
    archive_url: "{{ _gh_download_url }}"
    archive_install_dir: "{{ ctags_install_dir }}"
    archive_extra_opts:
      - "--strip-components=1"
    archive_binary_subpath: "bin/ctags"
    archive_symlink_name: "ctags"
