- hosts: localhost
  connection: local
  vars:
    bash_extra_config: "../files/thinkpad/bash"
    kitty_extra_config: "../files/thinkpad/kitty"
    neovim_extra_config: "../files/personal/neovim"
    extra_scripts:
      - "../files/personal/scripts"
      - "../files/thinkpad/scripts"
  roles:
    - { role: common, tags: common }
    # Hardware
    - { role: udev, tags: udev }
    # Software
    - { role: bash, tags: bash }
    - { role: git, tags: git }
    - { role: fzf, tags: fzf }
    - { role: cargo, tags: cargo }
    - { role: kitty, tags: kitty }
    - { role: inkscape, tags: inkscape }
    - { role: zathura, tags: zathura }
    - { role: cron, tags: cron }
    - { role: croc, tags: croc }
    - { role: rclone, tags: rclone }
    - { role: scripts, tags: scripts }
    # Development
    - { role: neovim, tags: neovim }
    - { role: ctags, tags: ctags }
    - { role: gdb, tags: gdb }
    - { role: latex, tags: latex }
    - { role: clojure, tags: clojure }
    - { role: racket, tags: racket }
    - { role: haskell, tags: haskell }
