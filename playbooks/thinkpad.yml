- hosts: localhost
  connection: local
  vars:
    kitty_extra_config: "../files/thinkpad/kitty"
    neovim_extra_config: "../files/thinkpad/neovim"
    extra_scripts: "../files/thinkpad/scripts"
  roles:
    - { role: common,  tags: common  }
    # Hardware
    - { role: udev,    tags: udev    }
    # Software
    - { role: bash,    tags: bash    }
    - { role: git,     tags: git     }
    - { role: fzf,     tags: fzf     }
    - { role: cargo,   tags: cargo   }
    - { role: kitty,   tags: kitty   }
    - { role: neovim,  tags: neovim  }
    - { role: cron,    tags: cron    }
    - { role: croc,    tags: croc    }
    - { role: rclone,  tags: rclone  }
    - { role: scripts, tags: scripts }
    - { role: latex,   tags: latex   }
    - { role: zathura, tags: zathura }
    - { role: gdb,     tags: gdb     }
    - { role: clojure, tags: clojure }
